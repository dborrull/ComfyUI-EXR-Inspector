[project]
name = "comfyui-exr-inspector"
description = "EXR inspection and A/B QC for renders and AOVs: wipe/blink/diff, exposure, false color, eyedropper with exact float values. Multilayer EXR (Nuke/Blender) decoded on the server, every compression, overscan, data passes."
version = "0.1.1"
license = "MIT"
dependencies = ["OpenImageIO>=3.0", "numpy"]

[project.urls]
Repository = "https://github.com/dborrull/ComfyUI-EXR-Inspector"
"Bug Tracker" = "https://github.com/dborrull/ComfyUI-EXR-Inspector/issues"

[tool.comfy]
PublisherId = "dborrull"
DisplayName = "EXR Inspector"
Icon = "https://raw.githubusercontent.com/dborrull/ComfyUI-EXR-Inspector/main/docs/icon.png"
